<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Detective</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --card-soft: #1c222b;
      --accent: #58a6ff;
      --text: #c9d1d9;
      --muted: #8b949e;
      --border: #30363d;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.32);
      --success: #3fb950;
      --danger: #f85149;
      --warning: #d29922;
    }

    body.light {
      --bg: #f0f2f5;
      --card: #ffffff;
      --card-soft: #f6f8fa;
      --accent: #0969da;
      --text: #24292f;
      --muted: #57606a;
      --border: #d0d7de;
      --shadow: 0 18px 42px rgba(31, 35, 40, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(88, 166, 255, 0.16), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background 0.3s, color 0.3s;
    }

    body.light {
      background:
        radial-gradient(circle at top left, rgba(9, 105, 218, 0.12), transparent 32rem),
        var(--bg);
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    .brand h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(2rem, 5vw, 3.6rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .brand p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-button,
    .mode-button,
    .search-button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition: transform 0.2s, border-color 0.2s, background 0.3s, color 0.3s, box-shadow 0.2s;
    }

    .icon-button {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
    }

    .mode-button {
      min-height: 48px;
      padding: 0 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .icon-button:hover,
    .mode-button:hover,
    .search-button:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .mode-button.active {
      background: color-mix(in srgb, var(--accent) 18%, var(--card));
      color: var(--accent);
      border-color: var(--accent);
    }

    .search-panel {
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--card) 94%, transparent);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
      transition: background 0.3s, border-color 0.3s;
    }

    .search-form,
    .battle-form {
      display: grid;
      gap: 14px;
    }

    .search-form {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .battle-form {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
      display: none;
    }

    body.battle .search-form {
      display: none;
    }

    body.battle .battle-form {
      display: grid;
    }

    .input {
      min-height: 54px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--bg);
      color: var(--text);
      padding: 0 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.3s, color 0.3s;
    }

    .input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .search-button {
      min-height: 54px;
      padding: 0 22px;
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      font-weight: 800;
    }

    .status-region {
      min-height: 160px;
      margin-top: 24px;
    }

    .loader {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 220px;
      color: var(--muted);
      animation: pulse 1.6s ease-in-out infinite;
    }

    .loader.visible {
      display: flex;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      50% {
        opacity: 0.68;
      }
    }

    .results {
      display: grid;
      gap: 18px;
      margin-top: 24px;
    }

    .profile-card,
    .error-card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s, background 0.3s, color 0.3s;
    }

    .profile-card.winner {
      border-color: var(--success);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--success) 62%, transparent), 0 0 34px color-mix(in srgb, var(--success) 28%, transparent);
    }

    .profile-card.loser {
      border-color: var(--danger);
    }

    .profile-card.tie {
      border-color: var(--warning);
    }

    .battle-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .profile-top {
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border: 3px solid var(--accent);
      border-radius: 50%;
      object-fit: cover;
      flex: 0 0 auto;
    }

    .profile-main {
      min-width: 0;
      flex: 1;
    }

    .profile-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }

    .profile-name {
      margin: 0;
      color: var(--text);
      font-size: 1.35rem;
      overflow-wrap: anywhere;
    }

    .username {
      display: inline-block;
      margin-top: 5px;
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    .bio {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card-soft);
      color: var(--text);
      padding: 7px 10px;
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.winner-badge {
      color: var(--success);
      border-color: color-mix(in srgb, var(--success) 70%, var(--border));
    }

    .badge.loser-badge {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 70%, var(--border));
    }

    .badge.tie-badge {
      color: var(--warning);
      border-color: color-mix(in srgb, var(--warning) 70%, var(--border));
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .stats.with-stars {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .stat {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card-soft);
      padding: 14px;
      min-width: 0;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .stat-value {
      display: block;
      margin-top: 7px;
      color: var(--text);
      font-size: 1.28rem;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .meta-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .meta-row a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    .section-title {
      margin: 26px 0 14px;
      color: var(--text);
      font-size: 1rem;
    }

    .repos-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .repo-card {
      border: 1px solid var(--border);
      background: var(--card-soft);
      border-radius: 16px;
      padding: 16px;
      min-height: 172px;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .repo-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.18);
    }

    .repo-card a {
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .repo-card p {
      min-height: 46px;
      margin: 10px 0 14px;
      color: var(--muted);
      line-height: 1.45;
    }

    .repo-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .language {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
    }

    .language::before {
      content: "";
      width: 9px;
      height: 9px;
      background: var(--accent);
      border-radius: 50%;
    }

    .error-card {
      display: grid;
      justify-items: center;
      gap: 12px;
      min-height: 220px;
      text-align: center;
    }

    .error-figure {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--card-soft);
      border: 1px solid var(--border);
      font-size: 2.2rem;
    }

    .error-card h2 {
      margin: 0;
      color: var(--text);
    }

    .error-card p {
      margin: 0;
      color: var(--muted);
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 220px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 760px) {
      .header,
      .profile-top {
        align-items: stretch;
        flex-direction: column;
      }

      .header-actions {
        justify-content: flex-start;
      }

      .search-form,
      .battle-form,
      .battle-grid,
      .repos-grid {
        grid-template-columns: 1fr;
      }

      .search-button {
        width: 100%;
      }

      .profile-name-row {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 520px) {
      .app {
        width: min(100% - 20px, 1120px);
        padding-top: 18px;
      }

      .search-panel,
      .profile-card,
      .error-card {
        padding: 16px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .stats.with-stars {
        grid-template-columns: 1fr;
      }

      .profile-top {
        text-align: center;
        align-items: center;
      }

      .meta-row {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <h1>Dev Detective 🔍</h1>
        <p>Search GitHub profiles instantly</p>
      </div>
      <div class="header-actions">
        <button class="mode-button" id="battleToggle" type="button">⚔️ Battle Mode</button>
        <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle light and dark mode">🌙</button>
      </div>
    </header>

    <section class="search-panel" aria-label="GitHub search controls">
      <form class="search-form" id="searchForm">
        <input class="input" id="usernameInput" type="text" placeholder="Enter GitHub username..." autocomplete="off">
        <button class="search-button" type="submit">Search</button>
      </form>

      <form class="battle-form" id="battleForm">
        <input class="input" id="battleUserOne" type="text" placeholder="First GitHub username..." autocomplete="off">
        <input class="input" id="battleUserTwo" type="text" placeholder="Second GitHub username..." autocomplete="off">
        <button class="search-button" type="submit">Compare</button>
      </form>
    </section>

    <section class="status-region" aria-live="polite">
      <div class="loader" id="loader">
        <div class="spinner" aria-hidden="true"></div>
        <strong>Fetching profile...</strong>
      </div>
      <div class="results" id="results">
        <div class="empty">Enter a GitHub username to start the search.</div>
      </div>
    </section>
  </main>

  <script>
    const API_ROOT = "https://api.github.com/users/";
    const themeToggle = document.getElementById("themeToggle");
    const battleToggle = document.getElementById("battleToggle");
    const searchForm = document.getElementById("searchForm");
    const battleForm = document.getElementById("battleForm");
    const usernameInput = document.getElementById("usernameInput");
    const battleUserOne = document.getElementById("battleUserOne");
    const battleUserTwo = document.getElementById("battleUserTwo");
    const loader = document.getElementById("loader");
    const results = document.getElementById("results");
    let battleMode = false;

    // Converts an ISO date string into a compact day-month-year display.
    function formatDate(isoString) {
      const date = new Date(isoString);
      return date.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    // Removes all rendered result nodes from the results container.
    function clearResults() {
      while (results.firstChild) {
        results.removeChild(results.firstChild);
      }
    }

    // Builds a DOM element with optional class names and text content.
    function createElement(tagName, className, text) {
      const element = document.createElement(tagName);
      if (className) {
        element.className = className;
      }
      if (text) {
        element.textContent = text;
      }
      return element;
    }

    // Ensures profile links open as absolute external URLs.
    function normalizeExternalUrl(url) {
      if (!url) {
        return "";
      }
      if (/^https?:\/\//i.test(url)) {
        return url;
      }
      return `https://${url}`;
    }

    // Shows the loading state and hides any current result cards.
    function showLoader() {
      clearResults();
      loader.classList.add("visible");
    }

    // Hides the loading state after an API flow has finished.
    function hideLoader() {
      loader.classList.remove("visible");
    }

    // Fetches a single GitHub user and normalizes 404 responses into readable errors.
    async function fetchUserData(username) {
      try {
        const response = await fetch(`${API_ROOT}${encodeURIComponent(username)}`);
        if (response.status === 404) {
          const error = new Error("User Not Found 😕");
          error.type = "not-found";
          throw error;
        }
        if (!response.ok) {
          throw new Error("Something went wrong. Try again.");
        }
        return await response.json();
      } catch (error) {
        throw error;
      }
    }

    // Fetches all repositories from a user's repos_url field.
    async function fetchRepositories(reposUrl) {
      try {
        const repositories = [];
        let page = 1;
        let hasMorePages = true;

        while (hasMorePages) {
          const response = await fetch(`${reposUrl}?per_page=100&page=${page}&sort=updated`);
          if (!response.ok) {
            throw new Error("Something went wrong. Try again.");
          }
          const pageData = await response.json();
          repositories.push(...pageData);
          hasMorePages = pageData.length === 100;
          page += 1;
        }

        return repositories;
      } catch (error) {
        throw error;
      }
    }

    // Adds the reusable stats row to a profile card.
    function appendStats(card, user, totalStars) {
      const stats = createElement("div", "stats");
      if (typeof totalStars === "number") {
        stats.classList.add("with-stars");
      }
      const values = [
        ["Repos", user.public_repos],
        ["Followers", user.followers],
        ["Following", user.following]
      ];

      if (typeof totalStars === "number") {
        values.push(["Stars", totalStars]);
      }

      values.slice(0, typeof totalStars === "number" ? 4 : 3).forEach(([label, value]) => {
        const stat = createElement("div", "stat");
        const statLabel = createElement("span", "stat-label", label);
        const statValue = createElement("span", "stat-value", String(value));
        stat.append(statLabel, statValue);
        stats.appendChild(stat);
      });

      card.appendChild(stats);
    }

    // Renders a complete profile card, optionally decorated with battle results.
    function renderProfile(user, options = {}) {
      const card = createElement("article", `profile-card ${options.statusClass || ""}`.trim());
      const top = createElement("div", "profile-top");
      const avatar = createElement("img", "avatar");
      avatar.src = user.avatar_url;
      avatar.alt = `${user.login} avatar`;

      const main = createElement("div", "profile-main");
      const nameRow = createElement("div", "profile-name-row");
      const name = createElement("h2", "profile-name", user.name || user.login);
      nameRow.appendChild(name);

      if (options.badgeText) {
        const badge = createElement("span", `badge ${options.badgeClass || ""}`.trim(), options.badgeText);
        nameRow.appendChild(badge);
      }

      const username = createElement("a", "username", `@${user.login}`);
      username.href = user.html_url;
      username.target = "_blank";
      username.rel = "noopener noreferrer";

      const bio = createElement("p", "bio", user.bio || "No bio available.");
      main.append(nameRow, username, bio);
      top.append(avatar, main);
      card.appendChild(top);

      appendStats(card, user, options.totalStars);

      const meta = createElement("div", "meta-row");
      const joined = createElement("span", "", `Joined ${formatDate(user.created_at)}`);
      const portfolio = createElement("a", "", user.blog ? "Portfolio" : "GitHub");
      portfolio.href = user.blog ? normalizeExternalUrl(user.blog) : user.html_url;
      portfolio.target = "_blank";
      portfolio.rel = "noopener noreferrer";
      meta.append(joined, portfolio);
      card.appendChild(meta);

      return card;
    }

    // Renders the latest five repositories in a responsive grid.
    function renderRepositories(repos) {
      const wrapper = createElement("section");
      const title = createElement("h3", "section-title", "Top 5 Latest Repositories");
      const grid = createElement("div", "repos-grid");
      const latestRepos = [...repos]
        .sort((first, second) => new Date(second.updated_at) - new Date(first.updated_at))
        .slice(0, 5);

      if (latestRepos.length === 0) {
        const empty = createElement("div", "empty", "No public repositories found.");
        wrapper.append(title, empty);
        return wrapper;
      }

      latestRepos.forEach((repo) => {
        const card = createElement("article", "repo-card");
        const link = createElement("a", "", repo.name);
        link.href = repo.html_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const description = createElement("p", "", repo.description || "No description");
        const meta = createElement("div", "repo-meta");
        const stars = createElement("span", "", `⭐ ${repo.stargazers_count}`);
        const forks = createElement("span", "", `🍴 ${repo.forks_count}`);
        const language = createElement("span", "language", repo.language || "Unknown");
        const updated = createElement("span", "", `Updated ${formatDate(repo.updated_at)}`);
        meta.append(stars, forks, language, updated);
        card.append(link, description, meta);
        grid.appendChild(card);
      });

      wrapper.append(title, grid);
      return wrapper;
    }

    // Displays a styled error card without allowing API failures to crash the app.
    function renderError(message) {
      clearResults();
      const card = createElement("article", "error-card");
      const figure = createElement("div", "error-figure", message.includes("Not Found") ? "👻" : "!");
      const title = createElement("h2", "", message);
      const details = createElement("p", "", "Check the username and try again.");
      card.append(figure, title, details);
      results.appendChild(card);
    }

    // Calculates a user's total stars across all loaded repositories.
    function calculateTotalStars(repos) {
      return repos.reduce((total, repo) => total + repo.stargazers_count, 0);
    }

    // Runs the normal single-user search flow with chained API calls.
    async function searchSingleUser(username) {
      try {
        showLoader();
        const user = await fetchUserData(username);
        const repos = await fetchRepositories(user.repos_url);
        hideLoader();
        clearResults();
        results.append(renderProfile(user), renderRepositories(repos));
      } catch (error) {
        hideLoader();
        renderError(error.type === "not-found" ? "User Not Found 😕" : "Something went wrong. Try again.");
      }
    }

    // Runs battle mode by fetching both users and both repo lists simultaneously.
    async function runBattleMode(firstUsername, secondUsername) {
      try {
        showLoader();
        const [firstUser, secondUser] = await Promise.all([
          fetchUserData(firstUsername),
          fetchUserData(secondUsername)
        ]);
        const [firstRepos, secondRepos] = await Promise.all([
          fetchRepositories(firstUser.repos_url),
          fetchRepositories(secondUser.repos_url)
        ]);
        const firstStars = calculateTotalStars(firstRepos);
        const secondStars = calculateTotalStars(secondRepos);
        hideLoader();
        renderBattleResults(firstUser, secondUser, firstStars, secondStars);
      } catch (error) {
        hideLoader();
        renderError(error.type === "not-found" ? "User Not Found 😕" : "Something went wrong. Try again.");
      }
    }

    // Renders the winner, loser, or tie comparison cards.
    function renderBattleResults(firstUser, secondUser, firstStars, secondStars) {
      clearResults();
      const grid = createElement("div", "battle-grid");
      const tie = firstStars === secondStars;
      const firstWon = firstStars > secondStars;
      const secondWon = secondStars > firstStars;

      const firstCard = renderProfile(firstUser, {
        totalStars: firstStars,
        statusClass: tie ? "tie" : firstWon ? "winner" : "loser",
        badgeText: tie ? "🤝 It's a Tie!" : firstWon ? "🏆 Winner" : "😞 Loser",
        badgeClass: tie ? "tie-badge" : firstWon ? "winner-badge" : "loser-badge"
      });

      const secondCard = renderProfile(secondUser, {
        totalStars: secondStars,
        statusClass: tie ? "tie" : secondWon ? "winner" : "loser",
        badgeText: tie ? "🤝 It's a Tie!" : secondWon ? "🏆 Winner" : "😞 Loser",
        badgeClass: tie ? "tie-badge" : secondWon ? "winner-badge" : "loser-badge"
      });

      grid.append(firstCard, secondCard);
      results.appendChild(grid);
    }

    // Toggles battle mode and swaps between single and dual search forms.
    function toggleBattleMode() {
      battleMode = !battleMode;
      document.body.classList.toggle("battle", battleMode);
      battleToggle.classList.toggle("active", battleMode);
      battleToggle.setAttribute("aria-pressed", String(battleMode));
      clearResults();
      const message = battleMode ? "Enter two usernames to compare total stars." : "Enter a GitHub username to start the search.";
      results.appendChild(createElement("div", "empty", message));
    }

    // Applies the stored color theme preference on startup.
    function applyStoredTheme() {
      const savedTheme = localStorage.getItem("devDetectiveTheme");
      const useLight = savedTheme === "light";
      document.body.classList.toggle("light", useLight);
      themeToggle.textContent = useLight ? "☀️" : "🌙";
      themeToggle.setAttribute("aria-pressed", String(useLight));
    }

    // Switches color themes and saves the user's preference.
    function toggleTheme() {
      const useLight = !document.body.classList.contains("light");
      document.body.classList.toggle("light", useLight);
      localStorage.setItem("devDetectiveTheme", useLight ? "light" : "dark");
      themeToggle.textContent = useLight ? "☀️" : "🌙";
      themeToggle.setAttribute("aria-pressed", String(useLight));
    }

    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const username = usernameInput.value.trim();
      if (username) {
        searchSingleUser(username);
      }
    });

    battleForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const firstUsername = battleUserOne.value.trim();
      const secondUsername = battleUserTwo.value.trim();
      if (firstUsername && secondUsername) {
        runBattleMode(firstUsername, secondUsername);
      }
    });

    battleToggle.addEventListener("click", toggleBattleMode);
    themeToggle.addEventListener("click", toggleTheme);
    applyStoredTheme();
  </script>
</body>
</html>
